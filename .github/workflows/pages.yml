# Публикация папки site/ на GitHub Pages при каждом push в main. Перед публикацией проверяется реестр карточек.
name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Проверка реестра карточек (только разрешённые поля, есть согласие)
        run: python3 tools/listings.py check
      - name: Проверка, что на сайте нет внешних скриптов, шрифтов и счётчиков
        run: |
          if grep -RniE "<script[^>]+src=\"https?://|fonts\.googleapis|googletagmanager|gtag\(|mc\.yandex|metrika|facebook\.net|supabase|telegram\.org" site --include=*.html --include=*.js; then
            echo "Найдены внешние подключения — сайт должен работать без них"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
